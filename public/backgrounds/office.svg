      <rect x="1036" y="172" width="64" height="14" fill="#e7d8b5"/>
      <rect x="1040" y="158" width="58" height="14" fill="#3b4a6b"/>
      <rect x="1112" y="128" width="16" height="72" fill="#7a3b69"/>
