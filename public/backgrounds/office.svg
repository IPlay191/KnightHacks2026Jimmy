      <rect x="1076" y="230" width="22" height="80" fill="#e7d8b5"/>
      <rect x="1100" y="246" width="16" height="64" fill="#7a3b69"/>
      <circle cx="1166" cy="276" r="26" fill="#3d6b9a"/>
      <path d="M1146 270 C1158 262 1172 284 1186 272" stroke="#7fb27b" stroke-width="6" fill="none"/>
