    <rect width="1280" height="720" fill="url(#wall)"/>
    <rect width="1280" height="26" fill="#f2e9dc"/>
    <rect y="26" width="1280" height="6" fill="#b8a385"/>
    <ellipse cx="700" cy="70" rx="520" ry="260" fill="url(#glow)"/>

    <!-- Window with a dusk skyline -->
    <rect x="60" y="80" width="470" height="420" rx="4" fill="#f5eee3"/>
    <rect x="78" y="98" width="434" height="384" fill="url(#sky)"/>
    <g clip-path="url(#win)">
      <circle cx="420" cy="400" r="46" fill="#ffd9a3" opacity=".75"/>
      <rect x="70" y="300" width="70" height="190" fill="#56648a"/>
      <rect x="132" y="250" width="58" height="240" fill="#3f4c6c"/>
