    <rect x="600" y="110" width="200" height="150" fill="#2b2a28"/>
    <rect x="612" y="122" width="176" height="126" fill="#f6f2ea"/>
    <circle cx="668" cy="178" r="34" fill="#e07a5f"/>
    <rect x="690" y="150" width="70" height="70" fill="#3d5a80" opacity=".9"/>
    <path d="M626 236 C670 200 720 250 774 214 L774 236 Z" fill="#f2cc8f"/>

