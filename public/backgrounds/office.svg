<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dac8"/>
      <stop offset="1" stop-color="#cdb99e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f78b8"/>
      <stop offset=".55" stop-color="#9fb4d8"/>
      <stop offset="1" stop-color="#f4c597"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5638"/>
      <stop offset="1" stop-color="#553822"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e583a"/>
      <stop offset="1" stop-color="#5f3f28"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1ebe1"/>
      <stop offset="1" stop-color="#cfc6b8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2cf" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff2cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78">
      <stop offset=".62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
    <pattern id="lit" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="6" height="8" fill="#ffd68c"/>
    </pattern>
    <clipPath id="win">
      <rect x="78" y="98" width="434" height="384"/>
    </clipPath>
    <filter id="dof" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#cdb99e"/>
