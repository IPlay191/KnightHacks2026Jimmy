      <path d="M832 560 C836 480 860 420 900 390 C884 450 860 510 840 560 Z" fill="#3e6a3c"/>
      <path d="M822 560 C780 530 744 500 730 450 C770 470 802 510 828 560 Z" fill="#5f8c55"/>
      <path d="M834 560 C850 520 880 492 920 480 C896 510 866 540 842 562 Z"/>
