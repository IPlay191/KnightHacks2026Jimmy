    </g>
    <g>
      <rect x="924" y="336" width="20" height="84" fill="#2f5d62"/>
      <rect x="946" y="344" width="16" height="76" fill="#c9b27c"/>
      <rect x="964" y="332" width="22" height="88" fill="#8c2f39"/>
      <rect x="988" y="348" width="14" height="72" fill="#3b4a6b"/>
      <rect x="1004" y="340" width="18" height="80" fill="#b85c38"/>
      <rect x="1024" y="352" width="16" height="68" fill="#6d8b74"/>
      <rect x="1042" y="338" width="20" height="82" fill="#d9a441"/>
      <rect x="1064" y="346" width="14" height="74" fill="#7a3b69"/>
      <rect x="1080" y="334" width="22" height="86" fill="#e7d8b5"/>
      <rect x="1120" y="404" width="76" height="16" fill="#3b4a6b"/>
      <rect x="1124" y="388" width="70" height="16" fill="#8c2f39"/>
